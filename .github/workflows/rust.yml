name: Rust

# Wisp is Windows-only (Win32, WinRT, Core Audio), so it builds and tests on a Windows runner
# with the same GNU toolchain used for releases.
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install the GNU toolchain
      run: |
        rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
        rustup default stable-x86_64-pc-windows-gnu
        rustc --version

    - name: Run tests
      run: cargo test --locked

    - name: Build release
      run: cargo build --release --locked

    # The smoke test drives the real window and writes PASS or FAIL to smoke-result.txt.
    # wisp.exe is a GUI-subsystem app, so wait for it explicitly.
    - name: Smoke test
      shell: pwsh
      run: |
        $p = Start-Process -FilePath target/release/wisp.exe -ArgumentList '--smoke-test' -PassThru
        if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "smoke test did not exit within 30 s" }
        if (-not (Test-Path smoke-result.txt)) { throw "smoke test wrote no smoke-result.txt" }
        $result = Get-Content smoke-result.txt -Raw
        Write-Output $result
        if (-not $result.StartsWith('PASS')) { throw "smoke test failed" }
