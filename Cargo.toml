[package]
name = "wisp"
version = "0.1.8+hf"
edition = "2021"
description = "An original, animated Windows desktop notch"
license = "MIT"

[dependencies]
windows = { version = "0.58", features = ["Media_Control", "Storage_Streams", "Foundation", "Foundation_Collections", "Web_Http", "Web_Http_Headers", "Web_Http_Filters", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
